
{% extends "base.html" %}

{% block title %}
    Cadastrar Participante | Sistema de Eventos
{% endblock %}


{% block content %}

<section class="pagina">

    <!-- Cabeçalho da página -->
    <header class="pagina__cabecalho">

        <h1>Cadastrar participante</h1>

        <p>
            Preencha os dados abaixo para cadastrar
            um novo participante.
        </p>

    </header>


    <!-- Formulário -->
    <form
        class="formulario"
        method="POST"
        action="{{ url_for('participantes.cadastrar_participante') }}"
    >

        <!-- Nome -->
        <div class="campo">

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                maxlength="200"
                placeholder="Digite o nome completo"
                autocomplete="name"
                required
            >

        </div>


        <!-- E-mail -->
        <div class="campo">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="200"
                placeholder="Digite o e-mail"
                autocomplete="email"
                required
            >

        </div>


        <!-- Tipo de participante -->
        <div class="campo">

            <label for="tipo">
                Tipo de participante
            </label>

            <select
                id="tipo"
                name="tipo"
                required
            >

                <option value="" selected disabled>
                    Selecione o tipo
                </option>

                <option value="estudante">
                    Estudante
                </option>

                <option value="professor">
                    Professor
                </option>

                <option value="externo">
                    Externo
                </option>

            </select>

        </div>


        <!-- Ações -->
        <div class="formulario__acoes">

            <a
                href="{{ url_for('main.index') }}"
                class="botao botao--secundario"
            >
                Voltar
            </a>

            <button
                type="submit"
                class="botao botao--primario"
            >
                Cadastrar participante
            </button>

        </div>

    </form>

</section>

{% endblock %}
